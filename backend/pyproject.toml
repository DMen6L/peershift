[project]
name = "peershift"
version = "0.1.0"
description = "Reproducible peer-selection research simulator"
readme = "README.md"
authors = [
    { name = "DMen6L", email = "tleuais@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
peershift = "peershift.cli:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10"]
