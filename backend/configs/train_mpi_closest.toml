# Small IID CPU training profile, shared by serial train and mpi-train.
num_clients = 3
rounds = 3
local_steps = 2
batch_size = 16
train_per_client = 64
validation_per_client = 16
test_samples = 64
hidden_size = 16
policy = "closest"
num_collaborators = 1
similarity_metric = "sum_tensor_l2"
aggregation_rule = "uniform_self_and_peers"
